
name: Build FinCip Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'redesign/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools'

      - name: Unit tests (CSV import/export engine)
        working-directory: FinCip-Native-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: FinCip-Native-Android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Build APK
        working-directory: FinCip-Native-Android
        env:
          SUPPORT_UPI_ID: ${{ secrets.SUPPORT_UPI_ID }}
          SUPPORT_PAYEE_NAME: ${{ secrets.SUPPORT_PAYEE_NAME }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinCip-debug-APK
          path: FinCip-Native-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
